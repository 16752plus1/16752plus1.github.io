---
layout: default
---

<main class="page-shell narrow">
  <article class="article">
    <header class="article-header">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p>{{ page.description }}</p>
      {% endif %}
    </header>

    <div class="article-content">
      {{ content }}
    </div>
  </article>
</main>
